# Namespace all backend resources (and the shared Ingress) are deployed into.
namespace: employee-app-poc

replicaCount: 1

image:
  # Placeholder Artifact Registry path - overridden per-environment/pipeline (tag = git commit SHA).
  repository: REGION-docker.pkg.dev/PROJECT_ID/employee-app/backend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Spring Boot startup is CPU-bound; at a 500m limit the web context alone took ~20s and the
# full start ran past the probe budget. Headroom here is mostly about startup latency.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Name of the Secret bootstrapped manually via `kubectl create secret` (see ARCHITECTURE.md section 7).
# This chart only *references* it (env/secretKeyRef) - it never defines Secret data.
secretName: employee-app-secrets

# Kubernetes ServiceAccount for the backend pod, annotated for Workload Identity so the
# Cloud SQL Auth Proxy sidecar can authenticate without a service account key.
# `name` must match Terraform's var.backend_ksa_name and `gcpServiceAccount` must match its
# `backend_workload_identity_sa_email` output - Terraform's IAM binding references this exact
# namespace/name pair, so changing either here without changing it there breaks DB access.
serviceAccount:
  name: backend
  gcpServiceAccount: employee-app-poc-backend-wi@hcldemo-504209.iam.gserviceaccount.com

# Name of the ConfigMap this chart creates (templates/configmap.yaml).
configMapName: employee-app-config

# Cloud SQL Auth Proxy sidecar configuration.
cloudsql:
  # Cloud SQL instance connection name (project:region:instance).
  # Templated into the ConfigMap (key: cloudsql-instance-connection-name) and consumed by the sidecar args.
  instanceConnectionName: "hcldemo-504209:us-central1:employee-app-poc-db"
  proxyImage:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    # Pinned deliberately: ":latest" makes deploys non-reproducible (the same chart revision
    # can silently pull a different proxy build) and an upstream regression would land in
    # production without any change on our side.
    tag: "2.24.1"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Reference to the frontend chart's Service - needed here because the shared Ingress
# (templates/ingress.yaml) lives in this chart and must route "/*" to the frontend Service.
# Keep in sync with helm/frontend's Service name/port if either changes.
frontendService:
  name: frontend
  port: 80

ingress:
  # Placeholder host - replace once a real domain is pointed at the Ingress IP.
  host: employee-app-poc.example.placeholder
  # GKE's native Ingress controller class.
  className: gce
  tls:
    # Name of a TLS Secret (type: kubernetes.io/tls) holding a self-signed cert for POC use.
    # Bootstrapped manually (openssl + kubectl create secret tls), same pattern as employee-app-secrets -
    # NOT created by this chart. See templates/ingress.yaml for the future managed-cert swap.
    secretName: employee-app-tls

# Gates the other two probes until the app has finished starting - see deployment.yaml.
startupProbe:
  path: /actuator/health
  port: 8080
livenessProbe:
  path: /actuator/health
  port: 8080
readinessProbe:
  path: /actuator/health
  port: 8080
