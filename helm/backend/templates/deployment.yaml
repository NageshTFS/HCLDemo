apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Binds the pod to the Workload Identity-annotated KSA (templates/serviceaccount.yaml).
      # Without this the pod runs as the namespace's "default" KSA, which has no annotation,
      # and the Cloud SQL proxy sidecar falls back to the node service account and gets a 403.
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        # --- Application container ---
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Backend connects to the Cloud SQL Auth Proxy sidecar on localhost, not directly to Cloud SQL.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: db-password
            - name: APP_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: auth-username
            - name: APP_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: auth-password
          # Spring Boot + Flyway migration startup exceeds what the liveness probe below would
          # tolerate on its own (it would kill the container at ~75s, before the app ever
          # serves /actuator/health, causing an unbreakable CrashLoopBackOff). Kubernetes
          # suspends both other probes until this one succeeds, so slow starts are handled
          # here rather than by loosening the ongoing liveness checks.
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: {{ .Values.startupProbe.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            # 30 x 10s = up to 5 minutes to finish starting.
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: {{ .Values.readinessProbe.port }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: {{ .Values.livenessProbe.port }}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # --- Cloud SQL Auth Proxy sidecar ---
        # Backend app connects to Cloud SQL via this sidecar at localhost:5432 (private IP, no public
        # Cloud SQL exposure). Instance connection name comes from the ConfigMap (templates/configmap.yaml),
        # which is templated from .Values.cloudsql.instanceConnectionName.
        - name: cloud-sql-proxy
          image: "{{ .Values.cloudsql.proxyImage.repository }}:{{ .Values.cloudsql.proxyImage.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDSQL_INSTANCE_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMapName }}
                  key: cloudsql-instance-connection-name
          args:
            - "--structured-logs"
            - "--port=5432"
            # The instance is private-IP only (infra/cloudsql.tf sets ipv4_enabled = false).
            # Without this the proxy tries the public IP and fails with
            # 'instance does not have IP of type "PUBLIC"'.
            - "--private-ip"
            # $(VAR) expansion requires a valid C-identifier env var name, hence the dedicated
            # CLOUDSQL_INSTANCE_CONNECTION_NAME env var above rather than referencing the
            # dashed ConfigMap key directly.
            - "$(CLOUDSQL_INSTANCE_CONNECTION_NAME)"
          resources:
            {{- toYaml .Values.cloudsql.resources | nindent 12 }}
