# Kubernetes-side half of the Workload Identity trust chain. Terraform (infra/iam.tf) grants
# roles/iam.workloadIdentityUser on the backend-wi GCP service account to
# <project>.svc.id.goog[<namespace>/<this KSA name>]; this annotation is what tells GKE which
# GCP service account pods using this KSA should impersonate.
#
# Without both halves, the Cloud SQL Auth Proxy sidecar silently falls back to the node's
# service account (which deliberately has no roles/cloudsql.client) and fails with a 403
# "missing permission cloudsql.instances.get" at connection time, not at deploy time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.serviceAccount.gcpServiceAccount | quote }}
